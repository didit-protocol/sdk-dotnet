# release-please keeps the release pull request up to date on every push to main. Merging it
# makes the next run create the vX.Y.Z tag and the GitHub release and then start release.yml for
# that tag, which publishes Didit and Didit.Extensions.DependencyInjection to NuGet with trusted
# publishing. Everything runs on GITHUB_TOKEN.
# Opens and updates the release pull request from conventional commits (docs/DESIGN.md section 13).
# Merging that pull request makes release-please tag the version and create a draft GitHub release.
# Publishing the draft (a person, after Alex approves) starts release.yml, which waits for the nuget environment.
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write # start release.yml
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Publish the release
        # A release created with GITHUB_TOKEN does not trigger the `release` event, so start
        # release.yml for the new tag directly (workflow_dispatch is allowed with GITHUB_TOKEN).
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
