# Opens and updates the release pull request from conventional commits (docs/DESIGN.md section 13).
# Merging that pull request makes release-please tag the version and create a draft GitHub release.
# Publishing the draft (a person, after Alex approves) starts release.yml, which waits for the nuget environment.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
